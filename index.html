<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quote Canvas Pro | Survive TV</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Playfair+Display:ital,wght@0,600;1,400&family=Space+Grotesk:wght@500;700&family=Cinzel:wght@600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090d16;
      --panel-bg: #131b2e;
      --panel-border: rgba(255, 255, 255, 0.08);
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding: 16px; display: flex; flex-direction: column; align-items: center; }
    
    header { text-align: center; margin-bottom: 20px; }
    header h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; background: linear-gradient(135deg, #fff 30%, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    header p { color: var(--text-muted); font-size: 0.85rem; margin-top: 4px; }

    .app-layout { width: 100%; max-width: 1050px; display: grid; grid-template-columns: 1fr; gap: 20px; }
    @media (min-width: 850px) { .app-layout { grid-template-columns: 1.2fr 1fr; align-items: start; } }

    .preview-stage { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); width: 100%; }
    .canvas-wrapper { width: 100%; display: flex; justify-content: center; align-items: center; overflow: hidden; border-radius: 10px; background: #000; }
    canvas { max-width: 100%; height: auto; display: block; border-radius: 8px; cursor: grab; touch-action: none; }
    canvas:active { cursor: grabbing; }

    .controls-panel { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); width: 100%; }
    
    .control-group { display: flex; flex-direction: column; gap: 6px; }
    .control-group label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    
    input[type="text"], input[type="file"], textarea, select { width: 100%; background: #0f172a; border: 1px solid var(--panel-border); border-radius: 8px; padding: 10px 12px; color: var(--text-main); font-size: 0.9rem; outline: none; transition: border-color 0.2s; }
    textarea { resize: vertical; min-height: 70px; }
    input[type="text"]:focus, textarea:focus, select:focus { border-color: var(--accent); }

    .ratio-buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .btn-ratio { background: #0f172a; border: 1px solid var(--panel-border); color: var(--text-muted); padding: 8px 10px; border-radius: 8px; font-size: 0.78rem; font-weight: 600; cursor: pointer; transition: all 0.2s; text-align: center; }
    .btn-ratio.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .color-pickers { display: flex; gap: 8px; align-items: center; }
    input[type="color"] { -webkit-appearance: none; border: none; width: 40px; height: 38px; border-radius: 6px; cursor: pointer; background: transparent; }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: 1px solid var(--panel-border); border-radius: 6px; }

    .btn-random { background: #334155; border: 1px solid var(--panel-border); color: #fff; border-radius: 8px; padding: 0 12px; font-size: 0.78rem; font-weight: 600; cursor: pointer; height: 38px; transition: background 0.2s; }
    .btn-random:hover { background: #475569; }

    .range-wrap { display: flex; align-items: center; gap: 10px; }
    input[type="range"] { flex: 1; accent-color: var(--accent); }
    .range-val { font-size: 0.8rem; color: var(--text-muted); width: 36px; text-align: right; }

    .action-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
    
    .btn-primary, .btn-secondary { color: #fff; border: none; padding: 12px 14px; border-radius: 8px; font-weight: 600; font-size: 0.88rem; cursor: pointer; transition: all 0.2s; display: flex; justify-content: center; align-items: center; gap: 6px; text-align: center; }
    .btn-primary { background: var(--accent); }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: #1e293b; border: 1px solid var(--panel-border); }
    .btn-secondary:hover { background: #334155; }
    .btn-success { background: var(--success) !important; }

    .hint-text { font-size: 0.75rem; color: var(--text-muted); text-align: center; }
    
    @media (max-width: 480px) {
      .action-buttons { grid-template-columns: 1fr; }
      body { padding: 12px 8px; }
      .controls-panel { padding: 14px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Quote Canvas Pro</h1>
    <p>Powered by SURVIVE TV 📺</p>
  </header>

  <div class="app-layout">
    <!-- Left Column: Canvas Preview -->
    <div class="preview-stage">
      <div class="canvas-wrapper">
        <canvas id="quoteCanvas" width="1080" height="1080"></canvas>
      </div>
      <p class="hint-text">Drag text vertically to adjust positioning</p>
    </div>

    <!-- Right Column: Controls -->
    <div class="controls-panel">
      <div class="control-group">
        <label>Format Presets</label>
        <div class="ratio-buttons">
          <button class="btn-ratio active" data-ratio="1:1">Post (1:1)</button>
          <button class="btn-ratio" data-ratio="9:16">Story (9:16)</button>
          <button class="btn-ratio" data-ratio="4:5">Portrait (4:5)</button>
        </div>
      </div>

      <div class="control-group">
        <label for="quoteText">Quote Text</label>
        <textarea id="quoteText">Design is not just what it looks like and feels like. Design is how it works.</textarea>
      </div>

      <div class="control-group">
        <label for="authorText">Author / Attribution</label>
        <input type="text" id="authorText" value="- Steve Jobs">
      </div>

      <div class="grid-2">
        <div class="control-group">
          <label for="fontFamily">Typography</label>
          <select id="fontFamily">
            <option value="Inter">Modern (Inter)</option>
            <option value="Playfair Display" selected>Classic Serif (Playfair)</option>
            <option value="Space Grotesk">Tech (Space Grotesk)</option>
            <option value="Cinzel">Elegant (Cinzel)</option>
          </select>
        </div>
        <div class="control-group">
          <label for="textAlign">Text Align</label>
          <select id="textAlign">
            <option value="center" selected>Center</option>
            <option value="left">Left</option>
            <option value="right">Right</option>
          </select>
        </div>
      </div>

      <div class="grid-2">
        <div class="control-group">
          <label for="bgPreset">Background Preset</label>
          <select id="bgPreset">
            <option value="midnight" selected>Midnight Gradient</option>
            <option value="sunset">Warm Sunset</option>
            <option value="emerald">Deep Emerald</option>
            <option value="dark">Pure Obsidian</option>
            <option value="image">Custom Photo Upload</option>
            <option value="custom">Custom Solid Colors</option>
          </select>
        </div>
        <div class="control-group">
          <label for="textShadow">Text Drop Shadow</label>
          <select id="textShadow">
            <option value="none">None</option>
            <option value="subtle" selected>Subtle Glow</option>
            <option value="strong">Deep Dark Shadow</option>
          </select>
        </div>
      </div>

      <div class="grid-2" id="photoUploadGroup" style="display: none;">
        <div class="control-group" style="grid-column: span 2;">
          <label for="bgImageInput">Upload Custom Background Image</label>
          <input type="file" id="bgImageInput" accept="image/*">
        </div>
      </div>

      <div class="grid-2">
        <div class="control-group">
          <label>Custom Gradient Colors</label>
          <div class="color-pickers">
            <input type="color" id="bgColor1" value="#0f172a">
            <input type="color" id="bgColor2" value="#1e1b4b">
            <button class="btn-random" id="randomizeBtn" title="Randomize Gradient">🎲 Random</button>
          </div>
        </div>
        <div class="control-group">
          <label for="textColor">Text Color</label>
          <div class="color-pickers">
            <input type="color" id="textColor" value="#ffffff">
          </div>
        </div>
      </div>

      <div class="grid-2">
        <div class="control-group">
          <label for="watermarkOpacity">Text Watermark Opacity</label>
          <select id="watermarkOpacity">
            <option value="0.08" selected>Subtle (8%)</option>
            <option value="0.15">Medium (15%)</option>
            <option value="0.25">Visible (25%)</option>
            <option value="0">Off</option>
          </select>
        </div>
      </div>

      <div class="grid-2">
        <div class="control-group">
          <label>Quote Font Size</label>
          <div class="range-wrap">
            <input type="range" id="fontSize" min="30" max="90" value="56">
            <span class="range-val" id="fontSizeVal">56px</span>
          </div>
        </div>
        <div class="control-group">
          <label>Author Font Size</label>
          <div class="range-wrap">
            <input type="range" id="authorSize" min="16" max="60" value="30">
            <span class="range-val" id="authorSizeVal">30px</span>
          </div>
        </div>
      </div>

      <div class="action-buttons">
        <button class="btn-secondary" id="copyBtn">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
          <span id="copyText">Copy Image</span>
        </button>
        <button class="btn-primary" id="downloadBtn">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
          Download HD
        </button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('quoteCanvas');
    const ctx = canvas.getContext('2d');

    const quoteInput = document.getElementById('quoteText');
    const authorInput = document.getElementById('authorText');
    const fontSelect = document.getElementById('fontFamily');
    const alignSelect = document.getElementById('textAlign');
    const bgPresetSelect = document.getElementById('bgPreset');
    const bgImageInput = document.getElementById('bgImageInput');
    const photoUploadGroup = document.getElementById('photoUploadGroup');
    const bgColor1Input = document.getElementById('bgColor1');
    const bgColor2Input = document.getElementById('bgColor2');
    const textColorInput = document.getElementById('textColor');
    const randomizeBtn = document.getElementById('randomizeBtn');
    const textShadowSelect = document.getElementById('textShadow');
    const fontSizeInput = document.getElementById('fontSize');
    const fontSizeVal = document.getElementById('fontSizeVal');
    const authorSizeInput = document.getElementById('authorSize');
    const authorSizeVal = document.getElementById('authorSizeVal');
    const watermarkOpacitySelect = document.getElementById('watermarkOpacity');
    const downloadBtn = document.getElementById('downloadBtn');
    const copyBtn = document.getElementById('copyBtn');
    const copyText = document.getElementById('copyText');
    const ratioBtns = document.querySelectorAll('.btn-ratio');

    let currentRatio = '1:1';
    let textOffsetY = 0;
    let isDragging = false;
    let dragStartY = 0;
    let customImage = null;

    // Load Logo for Watermark
    let logoImg = new Image();
    logoImg.src = 'logo.png';
    logoImg.onload = () => { render(); }; // Initial render on logo load

    const dimensions = {
      '1:1': { w: 1080, h: 1080 },
      '4:5': { w: 1080, h: 1350 },
      '9:16': { w: 1080, h: 1920 }
    };

    const modernGradients = [
      { c1: '#0f172a', c2: '#1e1b4b' },
      { c1: '#451a03', c2: '#78350f' },
      { c1: '#064e3b', c2: '#022c22' },
      { c1: '#311042', c2: '#111827' },
      { c1: '#1e3a8a', c2: '#0f172a' },
      { c1: '#831843', c2: '#3b0764' },
      { c1: '#14532d', c2: '#064e3b' },
      { c1: '#18181b', c2: '#27272a' },
      { c1: '#4a0404', c2: '#1c1917' }
    ];

    randomizeBtn.addEventListener('click', () => {
      bgPresetSelect.value = 'custom';
      photoUploadGroup.style.display = 'none';
      const randomPair = modernGradients[Math.floor(Math.random() * modernGradients.length)];
      bgColor1Input.value = randomPair.c1;
      bgColor2Input.value = randomPair.c2;
      render();
    });

    ratioBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        ratioBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentRatio = btn.dataset.ratio;
        textOffsetY = 0;
        updateCanvasSize();
      });
    });

    function updateCanvasSize() {
      const dim = dimensions[currentRatio] || dimensions['1:1'];
      canvas.width = dim.w;
      canvas.height = dim.h;
      render();
    }

    bgImageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          const img = new Image();
          img.onload = () => { customImage = img; render(); };
          img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    function drawBackground() {
      const preset = bgPresetSelect.value;
      const w = canvas.width;
      const h = canvas.height;

      if (preset === 'image' && customImage) {
        const imgRatio = customImage.width / customImage.height;
        const canvasRatio = w / h;
        let renderW, renderH, offsetX, offsetY;

        if (imgRatio > canvasRatio) {
          renderH = h; renderW = h * imgRatio;
          offsetX = (w - renderW) / 2; offsetY = 0;
        } else {
          renderW = w; renderH = w / imgRatio;
          offsetX = 0; offsetY = (h - renderH) / 2;
        }
        ctx.drawImage(customImage, offsetX, offsetY, renderW, renderH);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
        ctx.fillRect(0, 0, w, h);
        return;
      }

      let grad = ctx.createLinearGradient(0, 0, w, h);
      if (preset === 'midnight') {
        grad.addColorStop(0, '#0f172a'); grad.addColorStop(1, '#1e1b4b');
      } else if (preset === 'sunset') {
        grad.addColorStop(0, '#451a03'); grad.addColorStop(1, '#78350f');
      } else if (preset === 'emerald') {
        grad.addColorStop(0, '#064e3b'); grad.addColorStop(1, '#022c22');
      } else if (preset === 'dark') {
        grad.addColorStop(0, '#09090b'); grad.addColorStop(1, '#18181b');
      } else {
        grad.addColorStop(0, bgColor1Input.value); grad.addColorStop(1, bgColor2Input.value);
      }
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);
    }

    function drawWatermark() {
      const opacity = parseFloat(watermarkOpacitySelect.value);
      if (opacity <= 0) return;

      const w = canvas.width;
      const h = canvas.height;

      ctx.save();
      ctx.globalAlpha = opacity;
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      const line1 = 'SURVIVE TV 📺';
      const line2 = '08022835275';
      const stepX = 320;
      const stepY = 200;

      ctx.rotate(-20 * Math.PI / 180);
      for (let x = -w * 0.5; x < w * 1.5; x += stepX) {
        for (let y = -h * 0.5; y < h * 1.5; y += stepY) {
          ctx.font = '700 26px "Space Grotesk", sans-serif';
          ctx.fillText(line1, x, y - 14);
          ctx.font = '600 20px "Space Grotesk", sans-serif';
          ctx.fillText(line2, x, y + 14);
        }
      }
      ctx.restore();
    }

    function drawLogo() {
      // Draw Logo Watermark in bottom right corner
      if (logoImg.complete && logoImg.naturalWidth !== 0) {
        const logoH = canvas.height * 0.05; // 5% of canvas height
        const logoW = logoH * (logoImg.width / logoImg.height);
        const logoX = canvas.width - logoW - 40;
        const logoY = canvas.height - logoH - 40;
        
        ctx.save();
        ctx.globalAlpha = 0.85; // Slight transparency
        ctx.drawImage(logoImg, logoX, logoY, logoW, logoH);
        ctx.restore();
      }
    }

    function applyTextShadow() {
      const shadow = textShadowSelect.value;
      if (shadow === 'subtle') {
        ctx.shadowColor = 'rgba(0, 0, 0, 0.6)'; ctx.shadowBlur = 12; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 4;
      } else if (shadow === 'strong') {
        ctx.shadowColor = 'rgba(0, 0, 0, 0.9)'; ctx.shadowBlur = 24; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 6;
      } else {
        ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
      }
    }

    function render() {
      drawBackground();
      drawWatermark();
      drawLogo();

      const baseFontSize = parseInt(fontSizeInput.value, 10);
      const authorFontSize = parseInt(authorSizeInput.value, 10);
      const font = fontSelect.value;
      const align = alignSelect.value;
      const textColor = textColorInput.value;
      const w = canvas.width;
      const h = canvas.height;

      applyTextShadow();

      ctx.font = `600 ${baseFontSize}px "${font}", sans-serif`;
      ctx.fillStyle = textColor;
      ctx.textAlign = align;
      ctx.textBaseline = 'middle';

      let posX = w / 2;
      if (align === 'left') posX = w * 0.1;
      if (align === 'right') posX = w * 0.9;

      const words = quoteInput.value.split(' ');
      let line = '';
      let lines = [];
      const maxWidth = w * 0.8;
      const lineHeight = baseFontSize * 1.35;

      for (let n = 0; n < words.length; n++) {
        let testLine = line + words[n] + ' ';
        let metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
          lines.push(line.trim()); line = words[n] + ' ';
        } else {
          line = testLine;
        }
      }
      lines.push(line.trim());

      const authorSpacing = authorInput.value.trim() ? authorFontSize * 1.2 : 0;
      const totalBlockHeight = (lines.length * lineHeight) + authorSpacing;
      let startY = (h / 2) - (totalBlockHeight / 2) + textOffsetY;

      lines.forEach((l, index) => {
        ctx.fillText(l, posX, startY + (index * lineHeight));
      });

      if (authorInput.value.trim() !== '') {
        ctx.font = `400 italic ${authorFontSize}px "${font}", sans-serif`;
        ctx.fillStyle = textColor; ctx.globalAlpha = 0.85;
        const authorY = startY + (lines.length * lineHeight) + (authorFontSize * 0.6);
        ctx.fillText(authorInput.value.trim(), posX, authorY); ctx.globalAlpha = 1.0;
      }
      ctx.shadowColor = 'transparent';
    }

    function getCanvasY(e) {
      const rect = canvas.getBoundingClientRect();
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return (clientY - rect.top) * (canvas.height / rect.height);
    }

    canvas.addEventListener('mousedown', (e) => { isDragging = true; dragStartY = getCanvasY(e) - textOffsetY; });
    canvas.addEventListener('mousemove', (e) => { if (isDragging) { textOffsetY = getCanvasY(e) - dragStartY; render(); } });
    window.addEventListener('mouseup', () => { isDragging = false; });
    canvas.addEventListener('touchstart', (e) => { isDragging = true; dragStartY = getCanvasY(e) - textOffsetY; }, { passive: true });
    canvas.addEventListener('touchmove', (e) => { if (isDragging) { textOffsetY = getCanvasY(e) - dragStartY; render(); } }, { passive: true });
    window.addEventListener('touchend', () => { isDragging = false; });

    [quoteInput, authorInput, bgColor1Input, bgColor2Input, textColorInput].forEach(el => el.addEventListener('input', render));
    [fontSelect, alignSelect, bgPresetSelect, textShadowSelect, watermarkOpacitySelect].forEach(el => el.addEventListener('change', () => {
      photoUploadGroup.style.display = bgPresetSelect.value === 'image' ? 'grid' : 'none'; render();
    }));
    fontSizeInput.addEventListener('input', (e) => { fontSizeVal.textContent = `${e.target.value}px`; render(); });
    authorSizeInput.addEventListener('input', (e) => { authorSizeVal.textContent = `${e.target.value}px`; render(); });

    downloadBtn.addEventListener('click', () => {
      const link = document.createElement('a'); link.download = `survive-tv-quote-${Date.now()}.png`; link.href = canvas.toDataURL('image/png', 1.0); link.click();
    });

    copyBtn.addEventListener('click', async () => {
      try {
        canvas.toBlob(async (blob) => {
          if (!blob) throw new Error('Blob failed');
          if (navigator.clipboard && window.ClipboardItem) {
            await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]); showCopySuccess();
          } else {
            const link = document.createElement('a'); link.download = `survive-tv-quote.png`; link.href = URL.createObjectURL(blob); link.click(); showCopySuccess('Downloaded!');
          }
        }, 'image/png');
      } catch (err) { showCopySuccess('Failed!'); }
    });

    function showCopySuccess(label = 'Copied!') {
      copyBtn.classList.add('btn-success'); copyText.textContent = label;
      setTimeout(() => { copyBtn.classList.remove('btn-success'); copyText.textContent = 'Copy Image'; }, 2000);
    }

    document.fonts.ready.then(() => { updateCanvasSize(); });
  </script>
</body>
</html>
