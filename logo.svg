<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  <!-- TV Antenna -->
  <path d="M256 60 L300 120 H212 Z" fill="#3b82f6" />
  <circle cx="256" cy="70" r="12" fill="#60a5fa" />
  <!-- Screen Box -->
  <rect x="136" y="140" width="240" height="240" rx="40" fill="url(#accent)" opacity="0.15" stroke="#3b82f6" stroke-width="8" />
  <!-- Letter S -->
  <text x="256" y="275" font-family="system-ui, sans-serif" font-weight="800" font-size="140" fill="#ffffff" text-anchor="middle">S</text>
  <!-- Brand Text -->
  <text x="256" y="360" font-family="system-ui, sans-serif" font-weight="700" font-size="32" fill="#94a3b8" text-anchor="middle" letter-spacing="6">SURVIVE TV</text>
</svg>
